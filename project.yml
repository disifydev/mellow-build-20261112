name: Mellow
options:
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
packages:
  PivchikCore:
    path: PivchikCore
targets:
  Mellow:
    type: application
    platform: iOS
    sources:
      - path: Mellow
        excludes:
          - Mellow.entitlements
    dependencies:
      - package: PivchikCore
        product: PivchikDomain
    info:
      path: Mellow/Info.plist
      properties:
        CFBundleDisplayName: Mellow
        CFBundleDevelopmentRegion: ru
        CFBundleLocalizations: [ru]
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        ITSAppUsesNonExemptEncryption: false
        # Все .ttf из Mellow/Fonts. Шрифт заголовков — MellowSans-Bold.ttf (OFL); без него заголовки идут системным жирным.
        UIAppFonts:
          - Involve-Regular.ttf
          - Involve-Medium.ttf
          - Involve-SemiBold.ttf
          - Involve-Bold.ttf
          - MellowSans-Bold.ttf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.disify.pivchik
        TARGETED_DEVICE_FAMILY: 1
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Mellow/Mellow.entitlements
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        CODE_SIGNING_ALLOWED: NO
