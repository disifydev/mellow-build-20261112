name: Mellow
options:
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
packages:
  PivchikCore:
    path: PivchikCore
targets:
  Mellow:
    type: application
    platform: iOS
    sources: [Mellow]
    dependencies:
      - package: PivchikCore
        product: PivchikDomain
    info:
      path: Mellow/Info.plist
      properties:
        CFBundleDisplayName: Mellow
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        ITSAppUsesNonExemptEncryption: false
        # Все .ttf из Mellow/Fonts. MellowGrotesk.ttf появится позже: пока файла нет, заголовки идут системным шрифтом.
        UIAppFonts:
          - Involve-Regular.ttf
          - Involve-Medium.ttf
          - Involve-SemiBold.ttf
          - Involve-Bold.ttf
          - MellowGrotesk.ttf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.disify.pivchik
        TARGETED_DEVICE_FAMILY: 1
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGNING_ALLOWED: NO
